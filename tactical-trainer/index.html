","prescription":"Short-foot + single-leg balance (eyes-closed progression) + loaded ankle stiffness hops.","track":true},{"name":"Tibialis/neck/CARs","prescription":"Tib 3×20; iso neck 3×20 s; full CARs.","track":true}]},{"day":3,"title":"Upper Power-Strength","type":"high-cns","est":{"full":"90–105 min","crunch":"~65 min"},"crunch":"KEEP: med-ball · bench 4×4 · pull-up 4×4 · 1 heavy carry. CUT: ballistic push, OH press.","items":[{"name":"Rotational power","prescription":"Rotational throw 4×4/side higher output; overhead throw for distance 4×3.","track":true},{"name":"Ballistic push","prescription":"Push press or speed bench 5×3 @ ~50–60% (fast).","track":true},{"name":"Main push (3-5)","prescription":"Bench / weighted dip 4×4 heavy, 3–5 min rest.","track":true},{"name":"Main pull (3-5)","prescription":"Weighted pull-up 4×4; heavy row 4×5.","track":true},{"name":"Accessory","prescription":"OH press 3×6; face pulls 3×15.","track":true},{"name":"Loaded carry — heavy","prescription":"Heavy farmer 4×30 m; overhead carry 3×20 m.","track":true},{"name":"Grip & neck","prescription":"Thick-bar hold; neck harness 3×15. Breathing.","track":true}]},{"day":4,"title":"Regeneration","type":"easy","est":{"full":"30–40 min","crunch":"—"},"crunch":"","items":[{"name":"Mobility","prescription":"Full flow + targeted stretch toward 5 min/muscle/week.","track":false},{"name":"Optional heat/cold","prescription":"Away from lifting.","track":false},{"name":"Breathing","prescription":"Down-regulation.","track":false}]},{"day":5,"title":"Speed + Agility + Strength","type":"high-cns","est":{"full":"90–105 min","crunch":"~60 min"},"crunch":"KEEP: fly runs · reactive drill · split squat · 1 carry. CUT: pre-planned agility volume, single-arm push.","items":[{"name":"Speed — max velocity","prescription":"Fly runs 4×20 m (20 m build-in). Top-end speed, full recovery.","track":true},{"name":"Agility — reactive intro","prescription":"Mirror drill vs. partner 4×8 s; cue-based 3-cone; pre-planned 5- ":"Start on a visual/audio cue 6×15 m, full recovery.","track":true},{"name":"Agility — full reactive, multi-planar","prescription":"Partner/light mirror 5×8 s; multi-plane cut-and-go finishing with a med-ball throw.","track":true},{"name":"Strength maintenance","prescription":"Split squat 3×5/leg; single-arm pull 3×6. Lower volume, keep load.","track":true},{"name":"Loaded carries","prescription":"Mixed-carry medley: farmer→front-rack→overhead, 3 rounds × 20 m each.","track":true},{"name":"Core","prescription":"Anti-rotation + rotational power. Breathing.","track":true}]},{"day":6,"title":"Energy System (alactic + repeat-effort)","type":"working","est":{"full":"50–55 min","crunch":"—"},"crunch":"","items":[{"name":"Alactic power","prescription":"8 × 8 s max effort (hill/bike/sled), 60–90 s FULL recovery — no fade.","track":true},{"name":"Repeat-sprint ability","prescription":"6 × 40 m @ ~95% on 30 s.","track":true},{"name":"Tactical carry medley (optional)","prescription":"Sandbag + sled medley for time, 3–4 rounds.","track":true},{"name":"Maintenance VO2","prescription":"Optional short 4x4 every other week. Breathing.","track":true}]},{"day":7,"title":"Recovery / Test Prep","type":"recovery","est":{"full":"rest / easy","crunch":"—"},"crunch":"","items":[{"name":"Option","prescription":"Rest or easy Zone 2.","track":false},{"name":"Week 12","prescription":"Taper: drop volume, keep intensity, sleep-bank, then RETEST the battery.","track":false}]}]},"library":[{"title":"Energy Systems","color":"#166534","sections":[{"heading":"The three systems","rows":[["Alactic / Phosphagen","6–12 s, near-max, 1:10–20 rest. Pure power, speed, jumps, throws (ATP-PC)."],["Glycolytic / Anaerobic","20 s–2 min, hard, 1:1–1:3. Repeat-effort capacity, lactate tolerance."],["Aerobic — Zone 2","30–90 min conversational. Mitochondria, fat use, recovery between efforts."],["Aerobic — VO2 (Zone 5)","3–5 min reps, hardest sustainable, 1:1 (4x4). Aerobic ceiling."]],"notes":[]},{"heading":"Hinshaw method","rows":[],"notes":["Manipulate distance/time/rest/intensity to raise your maximum sustainable pace.","Progressions: 10×3/1 (capacity) → 6×2/2 (power) → 8×8 s/60–90 s (alactic).","Even, repeatable splits beat a fast start and a fade. Fatigue is the ceiling, not intensity."]}]},{"title":"Speed & Power","color":"#5B21B6","sections":[{"heading":"Weekly sprint structure","rows":[["Day A — Acceleration","10–30 m. Push the ground back; aggressive shin angle. (Day 1)"],["Day B — Max velocity","40–80 m via fly runs. Tall posture, front-side mechanics. (Day 5)"],["Volume","~150–300 m of true sprinting/session, FULL recovery. Never let it become conditioning."]],"notes":[]},{"heading":"Plyometric ladder","rows":[["Stage 1 — Extensive (B1)","Many low-intensity contacts: pogos, hops, skips, low step-offs."],["Stage 2 — Intensive (B2)","Max-effort jumps: box, broad, single-leg bound, hurdle hops."],["Stage 3 — Reactive/Shock (B3)","Depth jumps, drop-to-bound. Low volume, full recovery."]],"notes":[]},{"heading":"Force–velocity curve","rows":[],"notes":["Max strength → strength-speed → speed-strength → reactive/contrast.","Even under heavy load, INTEND to move explosively (recruits high-threshold motor units)."]}]},{"title":"Rotational Power","color":"#5B21B6","sections":[{"heading":"Throw menu","rows":[["Rotational throw (side)","Side-on to wall, load hip, fire ball in. 4–5×3–4/side, max intent."],["Scoop toss","Backward/forward scoop, total-body extension. 4×3."],["Overhead slam","Vertical power + anterior-core decel. 3–5×5."],["Side toss / shotput","Horizontal rotational projection (punch/push pattern). 4×3/side."]],"notes":[]},{"heading":"Programming","rows":[],"notes":["Light enough to throw FAST (6–12 lb). Velocity is the goal, not fatigue.","Low volume: 12–20 quality throws, full recovery. Stop when speed drops.","Placement: early Day 3; 'power on exit' to reactive agility Day 5."]}]},{"title":"Loaded Carries","color":"#78350F","sections":[{"heading":"Carry menu" // ─── HELPERS ─────────────────────────────────────────────────────────────────
function hexToRgba(hex, a) {
  var h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function parseCrunch(str) {
  if (!str) return null;
  var hasKeep = /KEEP:/i.test(str);
  if (!hasKeep) return { keep:'', cut:'', single:str };
  var keep='', cut='';
  var km = str.match(/KEEP:\s*([\s\S]*?)(?:CUT:|$)/i);
  var cm = str.match(/CUT:\s*([\s\S]*)$/i);
  if (km) keep = km[1].trim().replace(/\.$/, '');
  if (cm) cut = cm[1].trim();
  return { keep:keep, cut:cut, single:'' };
}
function el(tag, props, ...children) {
  var e = document.createElement(tag);
  if (props) {
    for (var k in props) {
      if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      else if (k === 'className') e.className = props[k];
      else if (k === 'htmlFor') e.htmlFor = props[k];
      else if (k === 'value' && (tag === 'input' || tag === 'textarea')) e.value = props[k] || '';
      else if (k === 'placeholder') e.placeholder = props[k];
      else if (k === 'type') e.type = props[k];
      else if (k === 'min') e.min = props[k];
      else if (k === 'max') e.max = props[k];
      else if (k === 'step') e.step = props[k];
      else if (k === 'accept') e.accept = props[k];
      else if (k === 'inputmode') e.inputMode = props[k];
      else e.setAttribute(k, props[k]);
    }
  }
  children.forEach(function(c) {
    if (c == null || c === false) return;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else if (c instanceof Node) e.appendChild(c);
  });
  return e;
}

// ─── STATE ───────────────────────────────────────────────────────────────────
var state = {
  tab: 'today',
  week: 1,
  day: 1,
  isDark: false,
  logs: {},
  tests: {},
  openLib: {},
  saved: false,
  _savedTimer: null
};

function setState(patch) {
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  render();
}

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function lkey() { return 'w'+state.week+':d'+state.day; }

var _persistLogTimer = null;
function persistLog(key) {
  clearTimeout(_persistLogTimer);
  _persistLogTimer = setTimeout(function() {
    try { localStorage.setItem('tactical:log:'+key, JSON.stringify(state.logs[key]||{})); } catch(e){}
    flashSaved();
  }, 350);
}
var _persistTestTimer = null;
function persistTests() {
  clearTimeout(_persistTestTimer);
  _persistTestTimer = setTimeout(function() {
    try { localStorage.setItem('tactical:tests', JSON.stringify(state.tests||{})); } catch(e){}
    flashSaved();
  }, 350);
}
function flashSaved() {
  state.saved = true;
  render();
  clearTimeout(state._savedTimer);
  state._savedTimer = setTimeout(function() { state.saved = false; render(); }, 1100);
}

function loadAll() {
  var logs = {}, tests = {};
  try {
    for (var w=1; w<=12; w++) for (var d=1; d<=7; d++) {
      var raw = localStorage.getItem('tactical:log:w'+w+':d'+d);
      if (raw) logs['w'+w+':d'+d] = JSON.parse(raw);
    }
  } catch(e){}
  try { var t = localStorage.getItem('tactical:tests'); if(t) tests = JSON.parse(t); } catch(e){}
  return { logs:logs, tests:tests };
}
function firstUnlogged(logs) {
  for (var w=1; w<=12; w++) for (var d=1; d<=7; d++) {
    var l = logs['w'+w+':d'+d];
    if (!l || !l.complete) return {week:w, day:d};
  }
  return {week:12, day:7};
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function updateItem(i, field, val) {
  var key = lkey();
  var logs = Object.assign({}, state.logs);
  var log = Object.assign({items:{}}, logs[key]);
  log.items = Object.assign({}, log.items);
  log.items[i] = Object.assign({}, log.items[i]);
  log.items[i][field] = val;
  logs[key] = log;
  state.logs = logs;
  persistLog(key);
  render();
}
function cycleStatus(i) {
  var key = lkey();
  var cur = ((state.logs[key]||{}).items||{})[i] || {};
  var order = ['not-started','done','failed'];
  var idx = order.indexOf(cur.status||'not-started');
  updateItem(i, 'status', order[(idx+1)%3]);
}
function setNotes(val) {
  var key = lkey();
  var logs = Object.assign({}, state.logs);
  var log = Object.assign({items:{}}, logs[key]);
  log.notes = val; logs[key] = log;
  state.logs = logs;
  persistLog(key);
}
function toggleComplete() {
  var key = lkey();
  var logs = Object.assign({}, state.logs);
  var log = Object.assign({items:{}}, logs[key]);
  log.complete = !log.complete;
  log.ts = log.complete ? Date.now() : log.ts;
  logs[key] = log; state.logs = logs;
  persistLog(key);
  render();
}
function setCrunchMode(on) {
  var key = lkey();
  var logs = Object.assign({}, state.logs);
  var log = Object.assign({items:{}}, logs[key]);
  log.crunch = on; logs[key] = log;
  state.logs = logs;
  persistLog(key);
  render();
}
function setTest(idx, col, val) {
  var tests = Object.assign({}, state.tests);
  var r = Object.assign({}, tests[idx]); r[col] = val; tests[idx] = r;
  state.tests = tests;
  persistTests();
}
function toggleLib(i) {
  var o = Object.assign({}, state.openLib);
  var cur = (i in o) ? o[i] : (i===0);
  o[i] = !cur; state.openLib = o;
  render();
}
function goto(w, d) { state.week=w; state.day=d; state.tab='today'; render(); }
function stepWeek(n) { state.week = Math.min(12, Math.max(1, state.week+n)); render(); }

// ─── BACKUP / RESTORE ────────────────────────────────────────────────────────
var _fileInput = null;
function exportBackup() {
  var data = {};
  try {
    for (var i=0; i<localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('tactical:')===0) data[k] = localStorage.getItem(k);
    }
  } catch(e){}
  var payload = { app:'tactical-trainer', version:1, exportedAt:new Date().toISOString(), data:data };
  try {
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href=url; a.download='tactical-trainer-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); }, 0);
    flashSaved();
  } catch(e){ try{window.alert('Export failed.');}catch(_){} }
}
function triggerImport() { if (_fileInput) _fileInput.click(); }
function handleImportFile(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var input = e.target;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var parsed = JSON.parse(ev.target.result);
      var bucket = (parsed && parsed.data && typeof parsed.data==='object') ? parsed.data : parsed;
      var keys = Object.keys(bucket||{}).filter(function(k){ return k.indexOf('tactical:')===0; });
      if (!keys.length) throw new Error('no-keys');
      if (!window.confirm('Restore this backup? It will replace your current training data on this device.')) { input.value=''; return; }
      var toRemove = [];
      for (var i=0; i<localStorage.length; i++) { var k=localStorage.key(i); if(k&&k.indexOf('tactical:')===0) toRemove.push(k); }
      toRemove.forEach(function(k){ localStorage.removeItem(k); });
      keys.forEach(function(k){
        var v = bucket[k];
        localStorage.setItem(k, typeof v==='string' ? v : JSON.stringify(v));
      });
      var loaded = loadAll();
      var fu = firstUnlogged(loaded.logs);
      state.logs = loaded.logs; state.tests = loaded.tests;
      state.week = fu.week; state.day = fu.day;
      flashSaved();
      render();
    } catch(err){ try{window.alert('Could not read that file — make sure it is a Tactical Trainer backup (.json).');}catch(_){} }
    input.value = '';
  };
  reader.readAsText(file);
}

    var modeRow = el('div', {style:{
      display:'flex',gap:'8px',background:T.card2,padding:'4px',
      borderRadius:'12px',border:'1px solid '+T.border,marginBottom:'12px'
    }});
    function modeBtn(active) {
      return {flex:1,padding:'10px',borderRadius:'9px',fontSize:'13.5px',fontWeight:700,
        background:active?T.card:'transparent',color:active?accent:T.sub,
        boxShadow:active?'0 1px 3px rgba(0,0,0,'+(dark?'.4':'.10')+')':'none'};
    }
    var fullBtn = el('button', {style:modeBtn(!crunchMode), onClick:function(){ setCrunchMode(false); }}, 'Full session');
    var crunchBtn = el('button', {style:modeBtn(crunchMode), onClick:function(){ setCrunchMode(true); }}, '60-min crunch');
    modeRow.appendChild(fullBtn); modeRow.appendChild(crunchBtn);
    content.appendChild(modeRow);

    // Crunch banner
    var parsed = parseCrunch(sess.crunch);
    if (crunchMode && parsed) {
      var cb = el('div', {style:{
        background:T.card2,border:'1px dashed '+T.border,borderRadius:'12px',
        padding:'12px 13px',marginBottom:'12px',display:'flex',flexDirection:'column',gap:'9px'
      }});
      if (parsed.single) {
        cb.appendChild(el('div', {style:{fontSize:'13px',lineHeight:1.45,color:T.text}}, parsed.single));
      } else {
        if (parsed.keep) {
          cb.appendChild(el('div', {style:{fontSize:'13px',lineHeight:1.45,color:T.text}},
            el('span', {style:{display:'inline-block',fontSize:'10px',fontWeight:800,letterSpacing:'.05em',
              color:T.green,background:hexToRgba(T.green,0.14),padding:'2px 6px',borderRadius:'5px',
              marginRight:'7px',verticalAlign:'1px'}}, 'KEEP'),
            parsed.keep
          ));
        }
        if (parsed.cut) {
          cb.appendChild(el('div', {style:{fontSize:'13px',lineHeight:1.45,color:T.sub}},
            el('span', {style:{display:'inline-block',fontSize:'10px',fontWeight:800,letterSpacing:'.05em',
              color:T.red,background:hexToRgba(T.red,0.13),padding:'2px 6px',borderRadius:'5px',
              marginRight:'7px',verticalAlign:'1px'}}, 'CUT'),
            parsed.cut
          ));
        }
      }
      content.appendChild(cb);
    }

    // Exercise cards
    sess.items.forEach(function(it, i) {
      var li = (log.items||{})[i] || {};
      var status = li.status || 'not-started';
      var card = el('div', {style:{
        background:T.card,border:'1px solid '+T.border,borderRadius:'14px',
        padding:'15px',marginBottom:'10px'
      }});
      card.appendChild(el('div', {style:{fontSize:'16px',fontWeight:700,letterSpacing:'-.01em',marginBottom:'5px'}}, it.name));
      card.appendChild(el('div', {style:{fontSize:'13.5px',lineHeight:1.5,color:T.sub}}, it.prescription));

      if (it.track) {
        var tw = el('div', {style:{marginTop:'13px',display:'flex',flexDirection:'column',gap:'11px'}});
        var inp = el('input', {
          type:'text', value:li.result||'',
          placeholder:'Load / result — e.g. 225 lb, 8.2 s',
          style:{width:'100%',padding:'12px 13px',fontSize:'16px',borderRadius:'10px',
            background:T.inBg,border:'1px solid '+T.border,color:T.text},
          onInput:(function(ii){ return function(e){ updateItem(ii,'result',e.target.value); }; })(i)
        });
        tw.appendChild(inp);

        var hasRpe = (li.rpe != null);
        var rpeRow = el('div', {style:{display:'flex',alignItems:'center',gap:'13px'}});
        var slider = document.createElement('input');
        slider.type='range'; slider.min=1; slider.max=10; slider.step=1;
        slider.value = hasRpe ? li.rpe : 5;
        Object.assign(slider.style, {flex:1,height:'24px',accentColor:accent});
        (function(ii){ slider.addEventListener('input', function(e){ updateItem(ii,'rpe',parseInt(e.target.value,10)); }); })(i);
        rpeRow.appendChild(slider);
        rpeRow.appendChild(el('div', {style:{fontSize:'13px',fontWeight:700,color:hasRpe?accent:T.faint,width:'58px',textAlign:'right',flexShrink:0}}, hasRpe?('RPE '+li.rpe):'RPE —'));
        tw.appendChild(rpeRow);

        var sInfo = status==='done' ? {l:'Done',bg:T.green,fg:'#fff',bd:T.green}
          : status==='failed' ? {l:'Failed',bg:T.red,fg:'#fff',bd:T.red}
          : {l:'Tap to log: Done / Failed',bg:'transparent',fg:T.sub,bd:T.border};
        var statusBtn = el('button', {
          style:{width:'100%',padding:'11px',borderRadius:'10px',fontSize:'14px',fontWeight:700,
            background:sInfo.bg,color:sInfo.fg,border:'1px solid '+sInfo.bd},
          onClick:(function(ii){ return function(){ cycleStatus(ii); }; })(i)
        }, sInfo.l);
        tw.appendChild(statusBtn);
        card.appendChild(tw);
      } else {
        var doneBtn = el('button', {
          style:{marginTop:'13px',width:'100%',padding:'11px',borderRadius:'10px',fontSize:'14px',fontWeight:700,
            background:li.done?accent:'transparent',color:li.done?'#fff':T.sub,
            border:'1px solid '+(li.done?accent:T.border)},
          onClick:(function(ii,ldone){ return function(){ updateItem(ii,'done',!ldone); }; })(i,!!li.done)
        }, li.done?'Done ✓':'Mark done');
        card.appendChild(doneBtn);
      }
      content.appendChild(card);
    });

    // Notes + complete card
    var notesCard = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
    notesCard.appendChild(el('div', {style:{fontSize:'12px',fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:T.sub,marginBottom:'10px'}}, 'Session notes'));
    var ta = document.createElement('textarea');
    ta.value = log.notes||'';
    ta.placeholder = 'How did it go? Pains, PRs, what to adjust next time…';
    Object.assign(ta.style, {width:'100%',minHeight:'72px',padding:'12px 13px',fontSize:'15px',lineHeight:1.4,
      borderRadius:'10px',background:T.inBg,border:'1px solid '+T.border,color:T.text,
      marginBottom:'11px',display:'block',fontFamily:'inherit',resize:'none',outline:'none'});
    ta.addEventListener('input', function(e){ setNotes(e.target.value); });
    notesCard.appendChild(ta);
    notesCard.appendChild(el('button', {
      style:{width:'100%',padding:'14px',borderRadius:'11px',fontSize:'15px',fontWeight:700,
        background:complete?T.green:accent,color:'#fff',border:'none'},
      onClick:toggleComplete
    }, complete?'Session complete ✓ — tap to undo':'Mark session complete'));
    if (log.ts) {
      notesCard.appendChild(el('div', {style:{fontSize:'12px',color:T.faint,marginTop:'9px',textAlign:'center'}},
        'Logged '+new Date(log.ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})
      ));
    }
    content.appendChild(notesCard);

  } else if (s.tab === 'library') {
    content.appendChild(el('div', {style:{fontSize:'24px',fontWeight:800,letterSpacing:'-.02em',marginBottom:'4px'}}, 'Reference Library'));
    content.appendChild(el('div', {style:{fontSize:'13px',color:T.sub,lineHeight:1.45,marginBottom:'16px'}}, 'Your paper packet, on the phone.'));

    PROGRAM.library.forEach(function(lib, i) {
      var open = (i in s.openLib) ? s.openLib[i] : (i===0);
      var card = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
      var hdr = el('button', {
        style:{display:'flex',alignItems:'center',gap:'10px',width:'100%',textAlign:'left',background:'none',border:'none',cursor:'pointer',padding:0},
        onClick:(function(ii){ return function(){ toggleLib(ii); }; })(i)
      },
        el('span', {style:{width:'9px',height:'9px',borderRadius:'2px',background:lib.color,flexShrink:0,display:'block'}}),
        el('span', {style:{fontSize:'16px',fontWeight:700,letterSpacing:'-.01em',color:T.text,flex:1}}, lib.title),
        el('span', {style:{marginLeft:'auto',fontSize:'18px',fontWeight:700,color:T.faint,width:'18px',textAlign:'center'}}, open?'–':'+')
      );
      card.appendChild(hdr);
      if (open) {
        var body = el('div', {style:{marginTop:'15px',display:'flex',flexDirection:'column',gap:'17px'}});
        lib.sections.forEach(function(sec) {
          var secEl = el('div', {});
          secEl.appendChild(el('div', {style:{fontSize:'12px',fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:T.sub,marginBottom:'10px'}}, sec.heading));
          (sec.rows||[]).forEach(function(row) {
            secEl.appendChild(el('div', {style:{display:'flex',gap:'12px',padding:'8px 0',borderTop:'1px solid '+T.border}},
              el('div', {style:{fontSize:'13.5px',fontWeight:700,width:'40%',flexShrink:0,lineHeight:1.4,color:T.text}}, row[0]),
              el('div', {style:{fontSize:'13.5px',color:T.sub,lineHeight:1.45,flex:1}}, row[1])
            ));
          });
          (sec.notes||[]).forEach(function(note) {
            secEl.appendChild(el('div', {style:{display:'flex',gap:'9px',padding:'5px 0'}},
              el('span', {style:{width:'5px',height:'5px',borderRadius:'50%',background:accent,marginTop:'7px',flexShrink:0,display:'block'}}),
              el('span', {style:{fontSize:'13.5px',color:T.sub,lineHeight:1.5}}, note)
            ));
          });
          body.appendChild(secEl);
        });
        card.appendChild(body);
      }
      content.appendChild(card);
    });

  } else if (s.tab === 'testing') {
    content.appendChild(el('div', {style:{fontSize:'24px',fontWeight:800,letterSpacing:'-.02em',marginBottom:'4px'}}, 'Test Battery'));
    content.appendChild(el('div', {style:{fontSize:'13px',color:T.sub,lineHeight:1.45,marginBottom:'16px'}}, 'Baseline Wk 1 · retest Wk 6 & 12. % vs baseline; green = improvement.'));

    var cats=[], byCat={};
    PROGRAM.tests.forEach(function(t, idx) {
      if (!byCat[t.cat]) { byCat[t.cat]={cat:t.cat,items:[]}; cats.push(byCat[t.cat]); }
      byCat[t.cat].items.push({t:t,idx:idx});
    });
    cats.forEach(function(grp) {
      var card = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
      card.appendChild(el('div', {style:{fontSize:'12px',fontWeight:800,letterSpacing:'.05em',textTransform:'uppercase',color:accent,marginBottom:'12px'}}, grp.cat));
      grp.items.forEach(function(item, gi) {
        var t=item.t, idx=item.idx;
        var r = s.tests[idx] || {};
        var w1=r.w1||'', w6=r.w6||'', w12=r.w12||'';
        var base=parseFloat(w1);
        var lastStr=(w12!=='')?w12:(w6!==''?w6:'');
        var last=parseFloat(lastStr);
        var pctLabel='—', pctColor=T.faint;
        if (!isNaN(base)&&!isNaN(last)&&base!==0) {
          var ch=(last-base)/base*100;
          var good = ch===0?null:(t.lower?ch<0:ch>0);
          pctColor = good===null?T.faint:(good?T.green:T.red);
          pctLabel=(ch>0?'+':'')+ch.toFixed(1)+'%';
        }
        var isLast = gi===grp.items.length-1;
        var row = el('div', {style:{paddingBottom:'14px',marginBottom:isLast?0:'14px',borderBottom:isLast?'none':'1px solid '+T.border}});
        row.appendChild(el('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:'10px'}},
          el('div', {style:{fontSize:'15px',fontWeight:700,color:T.text}}, t.name),
          el('div', {style:{fontSize:'13px',fontWeight:800,color:pctColor,flexShrink:0}}, pctLabel)
        ));
        row.appendChild(el('div', {style:{fontSize:'12px',color:T.faint,marginTop:'3px',marginBottom:'9px'}}, t.note+' · '+t.unit));
        var inputs = el('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'7px'}});
        [['w1','Wk 1',w1],['w6','Wk 6',w6],['w12','Wk 12',w12]].forEach(function(col) {
          var inp = document.createElement('input');
          inp.inputMode='decimal'; inp.value=col[2]; inp.placeholder=col[1];
          Object.assign(inp.style, {width:'100%',padding:'10px 8px',fontSize:'16px',textAlign:'center',
            borderRadius:'9px',background:T.inBg,border:'1px solid '+T.border,color:T.text,
            fontFamily:'inherit',outline:'none'});
          (function(ii,cc){ inp.addEventListener('input',function(e){ setTest(ii,cc,e.target.value); }); })(idx,col[0]);
          inputs.appendChild(inp);
        });
        row.appendChild(inputs);
        card.appendChild(row);
      });
      content.appendChild(card);
    });

  } else if (s.tab === 'progress') {
    content.appendChild(el('div', {style:{fontSize:'24px',fontWeight:800,letterSpacing:'-.02em',marginBottom:'4px'}}, 'Progress'));

    // Completed list
    var completedList=[];
    Object.keys(s.logs).forEach(function(k) {
      var l=s.logs[k]; if(!l||!l.complete) return;
      var m=k.match(/w(\d+):d(\d+)/); if(!m) return;
      var w=+m[1],d=+m[2];
      var winfo=PROGRAM.weeks[w-1]; var bl=PROGRAM.blocks.filter(function(b){return b.id===winfo.blockId;})[0];
      var ses=PROGRAM.sessions[winfo.blockId][d-1];
      completedList.push({week:w,day:d,title:ses.title,blockName:bl.name,ts:l.ts||0,color:bl.color,
        dateStr:l.ts?new Date(l.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'});
    });
    completedList.sort(function(a,b){return b.ts-a.ts;});

    var statRow = el('div', {style:{display:'flex',alignItems:'baseline',gap:'9px',marginBottom:'16px'}},
      el('div', {style:{fontSize:'38px',fontWeight:800,letterSpacing:'-.03em',color:accent,lineHeight:1}}, String(completedList.length)),
      el('div', {style:{fontSize:'14px',color:T.sub}}, 'of 84 sessions logged')
    );
    content.appendChild(statRow);

    // Grid
    var gridCard = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
    gridCard.appendChild(el('div', {style:{fontSize:'12px',fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:T.sub,marginBottom:'10px'}}, '12-week map — tap a cell to jump'));
    for (var gw=1; gw<=12; gw++) {
      (function(gw){
        var ginfo=PROGRAM.weeks[gw-1];
        var gbl=PROGRAM.blocks.filter(function(b){return b.id===ginfo.blockId;})[0];
        var gridRowEl = el('div', {style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'5px'}});
        gridRowEl.appendChild(el('div', {style:{width:'30px',fontSize:'11px',fontWeight:700,color:ginfo.deload?T.faint:T.sub,flexShrink:0}}, 'W'+gw));
        var cells = el('div', {style:{display:'flex',gap:'4px',flex:1}});
        for (var gd=1; gd<=7; gd++) {
          (function(gd){
            var doneCell=!!(s.logs['w'+gw+':d'+gd]&&s.logs['w'+gw+':d'+gd].complete);
            var isCur=(gw===s.week&&gd===s.day);
            var cell = el('button', {
              style:{
                flex:1,aspectRatio:'1/1',borderRadius:'5px',
                background:doneCell?gbl.color:T.card2,
                border:isCur?'2px solid '+T.text:'1px solid '+(doneCell?gbl.color:T.border),
                opacity:doneCell?1:0.85
              },
              onClick:function(){ goto(gw,gd); }
            });
            cells.appendChild(cell);
          })(gd);
        }
        gridRowEl.appendChild(cells);
        gridCard.appendChild(gridRowEl);
      })(gw);
    }
    // Legend
    var legendRow = el('div', {style:{display:'flex',alignItems:'center',gap:'6px',marginTop:'13px',flexWrap:'wrap'}});
    PROGRAM.blocks.forEach(function(bl) {
      legendRow.appendChild(el('span', {style:{width:'10px',height:'10px',borderRadius:'3px',background:bl.color,display:'inline-block'}}));
      legendRow.appendChild(el('span', {style:{fontSize:'11px',color:T.sub,marginRight:'8px'}}, bl.name));
    });
    gridCard.appendChild(legendRow);
    content.appendChild(gridCard);

    // Recent sessions
    var recCard = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
    recCard.appendChild(el('div', {style:{fontSize:'12px',fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:T.sub,marginBottom:'10px'}}, 'Recent sessions'));
    if (completedList.length===0) {
      recCard.appendChild(el('div', {style:{fontSize:'13px',color:T.faint,lineHeight:1.5,padding:'4px 0'}}, 'No sessions logged yet. Mark one complete on the Today tab.'));
    } else {
      completedList.forEach(function(c) {
        var row = el('button', {
          style:{display:'flex',alignItems:'center',gap:'11px',width:'100%',textAlign:'left',padding:'9px 0',borderBottom:'1px solid '+T.border,background:'none',border_bottom:'1px solid '+T.border,cursor:'pointer'},
          onClick:(function(w,d){ return function(){ goto(w,d); }; })(c.week,c.day)
        });
        Object.assign(row.style, {display:'flex',alignItems:'center',gap:'11px',width:'100%',textAlign:'left',padding:'9px 0',borderBottom:'1px solid '+T.border,background:'none',cursor:'pointer'});
        row.appendChild(el('span', {style:{width:'9px',height:'34px',borderRadius:'3px',background:c.color,flexShrink:0,display:'block'}}));
        var main = el('div', {style:{flex:1,minWidth:0}},
          el('div', {style:{fontSize:'14px',fontWeight:700,color:T.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, 'W'+c.week+' · D'+c.day+' — '+c.title),
          el('div', {style:{fontSize:'12px',color:T.sub,marginTop:'2px'}}, c.blockName)
        );
        row.appendChild(main);
        row.appendChild(el('div', {style:{fontSize:'12px',color:T.faint,flexShrink:0}}, c.dateStr));
        recCard.appendChild(row);
      });
    }
    content.appendChild(recCard);

    // Backup & restore
    var backupCard = el('div', {style:{background:T.card,border:'1px solid '+T.border,borderRadius:'14px',padding:'15px',marginBottom:'12px'}});
    backupCard.appendChild(el('div', {style:{fontSize:'12px',fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:T.sub,marginBottom:'10px'}}, 'Backup & restore'));
    backupCard.appendChild(el('div', {style:{fontSize:'13px',color:T.sub,lineHeight:1.5,marginBottom:'13px'}}, 'Your training data is stored only on this device. Export a backup file regularly — and before switching phones or clearing your browser.'));
    var btnRow = el('div', {style:{display:'flex',gap:'9px'}},
      el('button', {
        style:{flex:1,padding:'12px',borderRadius:'10px',fontSize:'14px',fontWeight:700,background:accent,color:'#fff',border:'none'},
        onClick:exportBackup
      }, 'Export backup'),
      el('button', {
        style:{flex:1,padding:'12px',borderRadius:'10px',fontSize:'14px',fontWeight:700,background:'transparent',color:T.text,border:'1px solid '+T.border},
        onClick:triggerImport
      }, 'Restore backup')
    );
    backupCard.appendChild(btnRow);
    var fi = el('input', {type:'file',accept:'application/json,.json',style:{display:'none'}});
    fi.addEventListener('change', handleImportFile);
    _fileInput = fi;
    backupCard.appendChild(fi);
    content.appendChild(backupCard);
  }

  shell.appendChild(content);

  // ── NAV ──
  function navBtn(label, tab) {
    var active = s.tab===tab;
    var btn = el('button', {
      style:{
        flex:1,padding:'12px 4px 14px',fontSize:'11.5px',fontWeight:700,letterSpacing:'.01em',
        color:active?accent:T.faint,borderTop:'2px solid '+(active?accent:'transparent'),
        background:'none',border:'none',cursor:'pointer'
      },
      onClick:(function(t){ return function(){ state.tab=t; render(); }; })(tab)
    }, label);
    return btn;
  }
  var nav = el('div', {style:{
    position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',
    width:'100%',maxWidth:'480px',display:'flex',
    background:T.card,borderTop:'1px solid '+T.border,zIndex:20
  }},
    navBtn('Today','today'),
    navBtn('Library','library'),
    navBtn('Testing','testing'),
    navBtn('Progress','progress')
  );
  shell.appendChild(nav);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
(function init() {
  // Dark mode
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    state.isDark = mq.matches;
    mq.addEventListener('change', function(e){ state.isDark=e.matches; render(); });
  } catch(e){}

  // Load data
  var loaded = loadAll();
  state.logs = loaded.logs;
  state.tests = loaded.tests;
  var fu = firstUnlogged(loaded.logs);
  state.week = fu.week;
  state.day = fu.day;

  render();

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
